[project]
name = "jobscout"
version = "0.1.0"
description = "Pull job postings from JSearch, store them, and (later) score them with Claude."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",        # HTTP client (think HttpClient in .NET)
    "python-dotenv>=1.0", # loads .env into environment variables
    "pandas>=2.2",        # tabular data (think LINQ + DataTable)
    "anthropic>=0.70",    # Claude API SDK
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",    # lets VS Code run notebooks against this project's environment
    "pytest>=8.0",
]

[project.scripts]
# After `uv sync`, `uv run jobscout ...` calls cli.main()
jobscout = "jobscout.cli:main"
jobscout-score = "jobscout.cli:score_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobscout"]
