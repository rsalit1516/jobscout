# What jobscout searches for. Edit freely; `uv run jobscout-run --dry-run` shows what would run.

[location]
query = "Delray Beach, FL"     # appended to each search as "<title> in <query>"
zip = "33446"
lat = 26.45                    # approximate centre of the zip, used for the distance filter
lon = -80.15
radius_miles = 25
# Used only when a posting has no coordinates.
nearby_cities = [
    "Delray Beach", "Boca Raton", "Boynton Beach", "Lake Worth", "Wellington",
    "West Palm Beach", "Deerfield Beach", "Highland Beach", "Palm Beach Gardens",
    "Coconut Creek", "Coral Springs", "Pompano Beach",
]

[search]
date_posted = "week"           # all | today | 3days | week | month
thin_threshold = 3             # run a group's variants only if its primary search finds fewer than this
max_calls = 15                 # hard cap on API calls per run (free tier is ~200/month)

[filters]
exclude_remote = true          # keep hybrid / on-site only
# A title must match one of these (case-insensitive regex) to count as management-level...
title_include = ['manager', 'mgr', 'director', 'head of', 'vice president', '\bvp\b']
# ...and must not match any of these (entry-level / individual-contributor markers).
title_exclude = ['intern', 'junior', '\bjr\b', 'entry', 'assistant', 'associate (?!director)']

[[groups]]
name = "Software Engineering Manager"
primary = "Software Engineering Manager"
variants = [
    "Engineering Manager", "Manager of Software Engineering", "Manager, Software Engineering",
    "Mgr, Software Engineering", "Software Engineering Mgr", "Engineering Manager, Software",
]

[[groups]]
name = "Technical Project Manager"
primary = "Technical Project Manager"
variants = [
    "Senior Technical Project Manager", "IT Project Manager",
    "Manager, IT Project Management", "Tech Project Manager",
]

[[groups]]
name = "Director of Software Engineering"
primary = "Director of Software Engineering"
variants = [
    "Director of Engineering", "Director, Software Engineering", "Software Engineering Director",
    "Sr Director of Engineering", "Senior Director of Engineering",
]
